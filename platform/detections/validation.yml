# TechDetechtives: which test proves each detection rule fires.
# Copyright (c) 2026 TechDetechtives. MIT licence (see LICENSE).
#
# Every Sigma rule in this folder has an entry (scripts/verify.sh repo checks).
# "atomic" tests are from Atomic Red Team (Red Canary, MIT licence), named by
# their permanent test id so they survive renumbering. Nothing from Atomic Red
# Team is copied here. "manual" tests are single harmless commands.
#
# Run tests only on a lab endpoint you own that reports to the platform.
# Procedure: docs/DETECTION-VALIDATION.md
#
# expect: alert  the rule should raise an alert
# expect: none   the rule should stay quiet; the entry records a known limit
#
# These expectations come from reading the rules and the test definitions.
# The "confirmed" field stays "no" until someone has run the test and seen the
# result on a live platform; write the date and platform version there.

atomic_red_team:
  repository: https://github.com/redcanaryco/atomic-red-team
  commit: 388942adbd9641f4dfdcf079d7efe9a75ec0ac43

checks:
  - rule: sigma/techdetechtives_wmi_spawns_script_interpreter.yml
    title: TechDetechtives - WMI Provider Host Spawning a Script Interpreter
    technique: T1047
    platform: windows
    needs: process start events from the endpoint (Elastic Defend or Sysmon)
    tests:
      - kind: atomic
        technique: T1047
        guid: b3bdfc91-b33e-4c6d-a5c8-d64bee0276b3
        name: WMI Execute Local Process
        run: 'Invoke-AtomicTest T1047 -TestGuids b3bdfc91-b33e-4c6d-a5c8-d64bee0276b3 -InputArgs @{ "process_to_execute" = "cscript.exe" }'
        plain: 'wmic process call create cscript.exe'
        expect: alert
        confirmed: "no"
        note: >
          The test's default program is notepad.exe, which this rule does not
          watch, so the argument is changed to a script interpreter. cscript.exe
          is used because the test's clean-up ends every process with that
          name; do not substitute cmd.exe or powershell.exe. Where wmic is no
          longer installed, use: powershell -Command "Invoke-WmiMethod -Class
          Win32_Process -Name Create -ArgumentList 'cscript.exe'"
      - kind: atomic
        technique: T1047
        guid: 7db7a7f9-9531-4840-9b30-46220135441c
        name: Create a Process using WMI Query and an Encoded Command
        run: 'Invoke-AtomicTest T1047 -TestGuids 7db7a7f9-9531-4840-9b30-46220135441c'
        expect: none
        confirmed: "no"
        note: >
          Starts notepad.exe through WMI. The rule only watches interpreters,
          so no alert is expected. Close the notepad window afterwards.

  - rule: sigma/techdetechtives_powershell_encoded_hidden.yml
    title: TechDetechtives - PowerShell Encoded Command With Hidden Window
    technique: T1059.001
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: manual
        name: Encoded command in a hidden window (prints one line of text)
        plain: 'powershell.exe -WindowStyle Hidden -EncodedCommand VwByAGkAdABlAC0ATwB1AHQAcAB1AHQAIAAnAFQAZQBjAGgARABlAHQAZQBjAGgAdABpAHYAZQBzACAAZABlAHQAZQBjAHQAaQBvAG4AIAB0AGUAcwB0ACcA'
        expect: alert
        confirmed: "no"
        note: >
          No stock atomic test combines an encoded command with a hidden
          window. The encoded text is: Write-Output 'TechDetechtives detection test'
      - kind: atomic
        technique: T1059.001
        guid: a538de64-1c74-46ed-aa60-b995ed302598
        name: PowerShell Command Execution
        run: 'Invoke-AtomicTest T1059.001 -TestGuids a538de64-1c74-46ed-aa60-b995ed302598'
        expect: none
        confirmed: "no"
        note: >
          Known limit. The test runs "powershell.exe -e <encoded>" with a
          visible window. The rule requires a hidden window as well, and does
          not list the short form "-e", so it stays quiet. Encoded commands
          alone are common in administration; cover them with a separate
          lower-level rule if you want to see them.

  - rule: sigma/techdetechtives_powershell_base64_decode_and_invoke.yml
    title: TechDetechtives - PowerShell Script Decodes Base64 and Invokes the Result
    technique: T1059.001
    platform: windows
    needs: PowerShell Script Block Logging (event 4104) enabled and collected
    tests:
      - kind: atomic
        technique: T1059.001
        guid: fa050f5e-bc75-4230-af73-b6fd7852cd73
        name: PowerShell Fileless Script Execution
        run: 'Invoke-AtomicTest T1059.001 -TestGuids fa050f5e-bc75-4230-af73-b6fd7852cd73'
        expect: alert
        confirmed: "no"
        note: >
          Stores a Base64 string in the registry, decodes it and runs it; the
          decoded command writes a marker file under the Windows Temp folder.
          Run the test's clean-up afterwards (add -Cleanup to the same command).

  - rule: sigma/techdetechtives_linux_download_piped_to_shell.yml
    title: TechDetechtives - Download Piped Directly Into a Shell
    technique: T1059.004
    platform: linux
    needs: process start events with command lines from the Linux endpoint (Elastic Defend)
    tests:
      - kind: atomic
        technique: T1059.004
        guid: fca246a8-a585-4f28-a2df-6495973976a1
        name: Detecting pipe-to-shell
        run: 'Invoke-AtomicTest T1059.004 -TestGuids fca246a8-a585-4f28-a2df-6495973976a1'
        expect: alert
        confirmed: "no"
        note: >
          Downloads a short script from the Atomic Red Team repository on
          GitHub and pipes it into bash; the script writes /tmp/art.txt. The
          endpoint needs internet access. Read the script before running it.
          Run the test's clean-up afterwards.
      - kind: atomic
        technique: T1059.004
        guid: d0c88567-803d-4dca-99b4-7ce65e7b257c
        name: Command-Line Interface
        run: 'Invoke-AtomicTest T1059.004 -TestGuids d0c88567-803d-4dca-99b4-7ce65e7b257c'
        expect: alert
        confirmed: "no"
        note: >
          The same idea with both curl and wget. Needs internet access.

  - rule: sigma/techdetechtives_lsass_dump_comsvcs.yml
    title: TechDetechtives - LSASS Memory Dump Through comsvcs.dll
    technique: T1003.001
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: atomic
        technique: T1003.001
        guid: 2536dee2-12fb-459a-8c37-971844fa73be
        name: Dump LSASS.exe Memory using comsvcs.dll
        run: 'Invoke-AtomicTest T1003.001 -TestGuids 2536dee2-12fb-459a-8c37-971844fa73be'
        expect: alert
        confirmed: "no"
        note: >
          Needs an administrator prompt. Endpoint protection usually blocks the
          dump itself; the alert is raised from the command line either way. Run
          the clean-up to remove the dump file, which would contain real
          credentials.

  - rule: sigma/techdetechtives_registry_hive_save_credentials.yml
    title: TechDetechtives - Credential Registry Hives Saved to a File
    technique: T1003.002
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: atomic
        technique: T1003.002
        guid: 5c2571d0-1572-416d-9676-812e64ca9f44
        name: Registry dump of SAM, creds, and secrets
        run: 'Invoke-AtomicTest T1003.002 -TestGuids 5c2571d0-1572-416d-9676-812e64ca9f44'
        expect: alert
        confirmed: "no"
        note: >
          Needs an administrator prompt. Writes three hive files to the Temp
          folder; run the clean-up so they are removed.
      - kind: manual
        name: Export of a key below a hive (not the hive itself)
        plain: 'reg export HKLM\SYSTEM\CurrentControlSet\Services\Tcpip %TEMP%\tcpip.reg'
        expect: none
        confirmed: "no"
        note: >
          Routine export of one key. The rule only reacts to the whole SAM,
          SECURITY or SYSTEM hive.

  - rule: sigma/techdetechtives_ntds_extraction.yml
    title: TechDetechtives - Active Directory Database Extraction
    technique: T1003.003
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon), on a lab domain controller
    tests:
      - kind: atomic
        technique: T1003.003
        guid: 2364e33d-ceab-4641-8468-bfb1d7cc2723
        name: Dump Active Directory Database with NTDSUtil
        run: 'Invoke-AtomicTest T1003.003 -TestGuids 2364e33d-ceab-4641-8468-bfb1d7cc2723'
        expect: alert
        confirmed: "no"
        note: >
          Only works on a domain controller, and only do this on a lab one: the
          output folder holds every account's password hash. Run the clean-up.

  - rule: sigma/techdetechtives_recovery_inhibited.yml
    title: TechDetechtives - Backups or Recovery Options Destroyed
    technique: T1490
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: manual
        name: Shadow copy deletion aimed at a drive that does not exist
        plain: 'vssadmin.exe delete shadows /for=Z: /quiet'
        expect: alert
        confirmed: "no"
        note: >
          Matches on the command line and deletes nothing when there is no Z:
          drive. Check that first.
      - kind: atomic
        technique: T1490
        guid: 43819286-91a9-4369-90ed-d31fb4da2c01
        name: Windows - Delete Volume Shadow Copies
        run: 'Invoke-AtomicTest T1490 -TestGuids 43819286-91a9-4369-90ed-d31fb4da2c01'
        expect: alert
        confirmed: "no"
        note: >
          Destructive: removes every restore point on the lab endpoint. Use the
          harmless command above unless you mean to test that.

  - rule: sigma/techdetechtives_event_logs_cleared.yml
    title: TechDetechtives - Windows Event Logs Cleared From the Command Line
    technique: T1685.005
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: manual
        name: Clearing a log that does not exist
        plain: 'wevtutil cl TechDetechtivesTestLog'
        expect: alert
        confirmed: "no"
        note: >
          Fails with 'channel not found' and clears nothing, but the command line
          is what the rule looks at.
      - kind: atomic
        technique: T1685.005
        guid: e6abb60e-26b8-41da-8aae-0c35174b0967
        name: Clear Logs
        run: 'Invoke-AtomicTest T1685.005 -TestGuids e6abb60e-26b8-41da-8aae-0c35174b0967'
        expect: alert
        confirmed: "no"
        note: >
          Destructive: empties the System log on the lab endpoint. Atomic Red Team
          files this test under T1685.005, the current number for clearing Windows
          event logs.

  - rule: sigma/techdetechtives_defender_tampering.yml
    title: TechDetechtives - Microsoft Defender Protection Switched Off or Excluded
    technique: T1685
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: atomic
        technique: T1685
        guid: 0b19f4ee-de90-4059-88cb-63c800c683ed
        name: Tamper with Windows Defender Evade Scanning -Folder
        run: 'Invoke-AtomicTest T1685 -TestGuids 0b19f4ee-de90-4059-88cb-63c800c683ed'
        expect: alert
        confirmed: "no"
        note: >
          Adds C:\Temp as a Defender exclusion; the clean-up removes it. Run the
          clean-up straight away so the endpoint is not left with an unscanned
          folder.

  - rule: sigma/techdetechtives_office_spawns_interpreter.yml
    title: TechDetechtives - Office Application Starting a Script Interpreter
    technique: T1204.002
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon); Microsoft Office installed on the endpoint
    tests:
      - kind: atomic
        technique: T1204.002
        guid: 9215ea92-1ded-41b7-9cd6-79f9a78397aa
        name: Office launching .bat file from AppData
        run: 'Invoke-AtomicTest T1204.002 -TestGuids 9215ea92-1ded-41b7-9cd6-79f9a78397aa'
        expect: alert
        confirmed: "no"
        note: >
          Needs Word installed and internet access (it downloads a helper script
          from the Atomic Red Team repository). Word starts cmd.exe to run a batch
          file.

  - rule: sigma/techdetechtives_signed_binary_remote_script.yml
    title: TechDetechtives - mshta or regsvr32 Running Script From a Remote Address
    technique: T1218.005
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: atomic
        technique: T1218.005
        guid: 8707a805-2b76-4f32-b1c0-14e558205772
        name: Mshta used to Execute PowerShell
        run: 'Invoke-AtomicTest T1218.005 -TestGuids 8707a805-2b76-4f32-b1c0-14e558205772'
        expect: alert
        confirmed: "no"
        note: >
          mshta runs an inline script that prints a line with PowerShell. Nothing
          is downloaded.
      - kind: atomic
        technique: T1218.010
        guid: c9d0c4ef-8a96-4794-a75b-3d3a5e6f2a36
        name: Regsvr32 remote COM scriptlet execution
        run: 'Invoke-AtomicTest T1218.010 -TestGuids c9d0c4ef-8a96-4794-a75b-3d3a5e6f2a36'
        expect: alert
        confirmed: "no"
        note: >
          Needs internet access: regsvr32 loads a scriptlet from the Atomic Red
          Team repository, which opens the calculator.
      - kind: atomic
        technique: T1218.010
        guid: 449aa403-6aba-47ce-8a37-247d21ef0306
        name: Regsvr32 local COM scriptlet execution
        run: 'Invoke-AtomicTest T1218.010 -TestGuids 449aa403-6aba-47ce-8a37-247d21ef0306'
        expect: none
        confirmed: "no"
        note: >
          Known limit. The scriptlet is loaded from a local file, and the rule
          only reacts to a remote address.

  - rule: sigma/techdetechtives_certutil_download_or_decode.yml
    title: TechDetechtives - certutil Used to Download or Decode a File
    technique: T1105
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: atomic
        technique: T1105
        guid: dd3b61dd-7bbc-48cd-ab51-49ad1a776df0
        name: certutil download (urlcache)
        run: 'Invoke-AtomicTest T1105 -TestGuids dd3b61dd-7bbc-48cd-ab51-49ad1a776df0'
        expect: alert
        confirmed: "no"
        note: >
          Needs internet access. Downloads a licence text file; run the clean-up
          to remove it.
      - kind: atomic
        technique: T1140
        guid: dc6fe391-69e6-4506-bd06-ea5eeb4082f8
        name: Deobfuscate/Decode Files Or Information
        run: 'Invoke-AtomicTest T1140 -TestGuids dc6fe391-69e6-4506-bd06-ea5eeb4082f8'
        expect: alert
        confirmed: "no"
        note: >
          Encodes and decodes a copy of the calculator in the Temp folder. Run the
          clean-up.

  - rule: sigma/techdetechtives_scheduled_task_suspicious_action.yml
    title: TechDetechtives - Scheduled Task Created to Run a Script or a User-Writable File
    technique: T1053.005
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: atomic
        technique: T1053.005
        guid: 6731e8a0-5aeb-4180-8a90-4f8852e56de6
        name: Turla KopiLuwak Scheduled Task for JavaScript Stager
        run: 'Invoke-AtomicTest T1053.005 -TestGuids 6731e8a0-5aeb-4180-8a90-4f8852e56de6'
        expect: alert
        confirmed: "no"
        note: >
          Registers a logon task that would run a script from the AppData folder.
          The script does not exist, so nothing runs. Run the clean-up to remove
          the task.
      - kind: atomic
        technique: T1053.005
        guid: 42f53695-ad4a-4546-abb6-7d837f644a71
        name: Scheduled task Local
        run: 'Invoke-AtomicTest T1053.005 -TestGuids 42f53695-ad4a-4546-abb6-7d837f644a71'
        expect: none
        confirmed: "no"
        note: >
          Known limit. The task runs a program from the Windows folder with no
          script or user-writable path, which the rule treats as ordinary.

  - rule: sigma/techdetechtives_service_created_suspicious_binary.yml
    title: TechDetechtives - Service Created to Run a Script or a User-Writable File
    technique: T1543.003
    platform: windows
    needs: process start events with command lines (Elastic Defend or Sysmon)
    tests:
      - kind: manual
        name: Service whose program is a command interpreter
        plain: 'sc.exe create TDTest binPath= "cmd.exe /c echo td" start= demand'
        expect: alert
        confirmed: "no"
        note: >
          Needs an administrator prompt. The service is created but never started.
          Remove it afterwards with: sc.exe delete TDTest
      - kind: atomic
        technique: T1543.003
        guid: 981e2942-e433-44e9-afc1-8c957a1496b6
        name: Service Installation CMD
        run: 'Invoke-AtomicTest T1543.003 -TestGuids 981e2942-e433-44e9-afc1-8c957a1496b6'
        expect: none
        confirmed: "no"
        note: >
          Known limit. The service program sits in the Atomic Red Team folder, not
          in a user-writable or temporary one, so the rule stays quiet.

  - rule: sigma/techdetechtives_linux_reverse_shell.yml
    title: TechDetechtives - Reverse Shell Command Line on Linux
    technique: T1059.004
    platform: linux
    needs: process start events with command lines from the Linux endpoint (Elastic Defend)
    tests:
      - kind: manual
        name: Shell redirected to a local port that nothing listens on
        plain: 'bash -c ''echo test > /dev/tcp/127.0.0.1/9'''
        expect: alert
        confirmed: "no"
        note: >
          Tries to connect to this same machine and fails; nothing leaves it. The
          command line has the form a reverse shell uses.

  - rule: sigma/techdetechtives_ot_bacnet_device_disabled_or_restarted.yml
    title: TechDetechtives - BACnet Device Told to Restart or Stop Communicating
    technique: T0816
    platform: ot
    needs: the platform sensor seeing the traffic of an OT lab (simulators are enough)
    tests:
      - kind: manual
        name: ReinitializeDevice sent to a BACnet simulator
        plain: 'bacrd <device instance> 0'
        expect: alert
        confirmed: "no"
        note: >
          bacrd is the ReinitializeDevice tool of the open-source bacnet-stack
          project. Send it only to a simulator or a test controller: a real one
          restarts.

  - rule: sigma/techdetechtives_ot_bacnet_objects_changed.yml
    title: TechDetechtives - BACnet Objects Created, Deleted or Files Written
    technique: T0843
    platform: ot
    needs: the platform sensor seeing the traffic of an OT lab (simulators are enough)
    tests:
      - kind: manual
        name: File written to a BACnet simulator
        plain: 'bacawf <device instance> <file instance> <local file>'
        expect: alert
        confirmed: "no"
        note: >
          bacawf is the AtomicWriteFile tool of the bacnet-stack project. Use a
          simulator or a test controller only.

  - rule: sigma/techdetechtives_ot_s7_program_transfer.yml
    title: TechDetechtives - Siemens S7 Program Downloaded to or Uploaded From a PLC
    technique: T0843
    platform: ot
    needs: the platform sensor seeing the traffic of an OT lab (simulators are enough)
    tests:
      - kind: manual
        name: Block upload from an S7 simulator
        plain: 'python3 -c "import snap7; c=snap7.client.Client(); c.connect(''<simulator IP>'', 0, 1); c.full_upload(snap7.type.Block.OB, 1)"'
        expect: alert
        confirmed: "no"
        note: >
          Uses the open-source python-snap7 library against an S7-300/400
          simulator (the snap7 server, or a PLC simulator). Never against a
          controller that runs a process. The exact name of the block type differs
          between python-snap7 versions.

# Rules for other engines. No atomic test fits; these are single commands run
# on a monitored lab host whose traffic passes the sensor.
network_checks:
  - rule: suricata/techdetechtives.rules
    sid: 1900001
    plain: 'nslookup td-test.duckdns.org'
    expect: alert
    confirmed: "no"
    note: The name does not need to exist; the query itself is what the rule sees.
  - rule: suricata/techdetechtives.rules
    sid: 1900002
    plain: 'powershell -Command "Invoke-WebRequest http://example.com -UseBasicParsing"'
    expect: alert
    confirmed: "no"
    note: >
      Must be plain http (not https) from a host inside the monitored network
      to an outside address, or the sensor cannot read the request.

# OT network rules (platform/detections/suricata/techdetechtives-ot.rules).
# Run these only against simulators or test controllers in a lab whose
# traffic the sensor sees. Several of them stop or restart the target.
ot_network_checks:
  - rule: suricata/techdetechtives-ot.rules
    sid: [1900103, 1900104]
    plain: 'nmap -p 502 --script modbus-discover <simulator IP>'
    expect: alert
    confirmed: "no"
    note: The script asks for the device identification and the server id, which is what the two low-severity inventory rules look for.
  - rule: suricata/techdetechtives-ot.rules
    sid: [1900151]
    plain: 'python3 -c "import snap7; c=snap7.client.Client(); c.connect(''<simulator IP>'', 0, 1); c.plc_stop()"'
    expect: alert
    confirmed: "no"
    note: Sends the S7 STOP command. A real controller would stop its process; use a simulator.
  - rule: suricata/techdetechtives-ot.rules
    sid: [1900121]
    plain: 'A DNP3 master simulator sending Cold Restart to an outstation simulator'
    expect: alert
    confirmed: "no"
    note: Any DNP3 test master can send this function. Use simulators on both ends.
