title: TechDetechtives - GeoServer Server Starts a Shell (CVE-2026-129243)
id: dcf7db5f-dd4d-573c-962e-5d95da908375
status: experimental
description: Detects the GeoServer server process starting a shell or a reconnaissance tool, which is what exploiting CVE-2026-129243
  (OSGeo GeoServer Incorrect Authorization Vulnerability) leads to. Drafted by the TechDetechtives rule factory; review before
  approving.
references:
- https://nvd.nist.gov/vuln/detail/CVE-2026-129243
- https://geoserver.org/vulnerability/2026/11/23/cve-update.html
- https://github.com/geoserver/geoserver/security/advisories/GHSA-rv5g-g2r9-58rj
- https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
author: TechDetechtives rule factory
date: '2026-11-27'
tags:
- attack.initial_access
- attack.t1190
- attack.execution
- cve.2026-129243
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|endswith:
    - /java
    ParentCommandLine|contains:
    - geoserver
  selection_child:
    Image|endswith:
    - /sh
    - /bash
    - /dash
    - /zsh
    - /nc
    - /ncat
    - /socat
    - /whoami
    - /id
    - /curl
    - /wget
    - /perl
  condition: selection_parent and selection_child
falsepositives:
- Administration scripts that GeoServer runs on purpose; add their command lines as filters
level: high
