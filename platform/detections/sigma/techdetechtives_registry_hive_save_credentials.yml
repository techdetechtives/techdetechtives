title: TechDetechtives - Credential Registry Hives Saved to a File
id: c9b2a515-89cc-5130-8906-7e6e874c3a65
status: experimental
description: >
  Detects reg.exe saving or exporting the SAM, SECURITY or SYSTEM hive. Together
  those files hold local account password hashes and cached domain credentials.
author: TechDetechtives
date: 2026-10-05
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\reg.exe'
  selection_action:
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_hive:
    # The hive itself, not a key below it: the name is followed by a space or a quote.
    CommandLine|contains:
      - 'hklm\sam '
      - 'hklm\security '
      - 'hklm\system '
      - 'hklm\sam"'
      - 'hklm\security"'
      - 'hklm\system"'
      - 'hkey_local_machine\sam '
      - 'hkey_local_machine\security '
      - 'hkey_local_machine\system '
  condition: selection_image and selection_action and selection_hive
falsepositives:
  - Backup scripts that save the whole registry, and some forensic collection tools
level: high
