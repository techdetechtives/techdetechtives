title: TechDetechtives - Web Server or PHP Starts a Shell on Linux
id: f25eeca1-a98e-466c-8d21-b856d7defac1
status: experimental
description: >
  Detects a web server or PHP process starting a shell, a network tool or a
  reconnaissance command. This is how a web shell runs its commands, and how
  remote code execution in a PHP application turns into a shell (for example
  the PHP-CGI argument injection CVE-2024-4577, or eval and system calls fed
  from a request). Web servers piping their own logs through rotatelogs or
  cronolog are left out.
references:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://nvd.nist.gov/vuln/detail/CVE-2024-4577
author: TechDetechtives
date: 2026-11-03
tags:
  - attack.persistence
  - attack.t1505.003
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent_server:
    ParentImage|endswith:
      - '/httpd'
      - '/apache2'
      - '/nginx'
      - '/lighttpd'
      - '/caddy'
  selection_parent_php:
    ParentImage|contains:
      - '/php-fpm'
      - '/php-cgi'
      - '/bin/php'
  selection_child_shell:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
      - '/ksh'
      - '/nc'
      - '/ncat'
      - '/netcat'
      - '/socat'
      - '/whoami'
      - '/id'
      - '/uname'
      - '/hostname'
      - '/curl'
      - '/wget'
      - '/perl'
  selection_child_python:
    Image|contains: '/python'
  filter_log_pipes:
    CommandLine|contains:
      - 'rotatelogs'
      - 'cronolog'
  condition: 1 of selection_parent_* and 1 of selection_child_* and not filter_log_pipes
falsepositives:
  - PHP applications that call system tools on purpose (image converters, mail via sendmail through sh, backup plugins); add their exact command lines as filters
  - The PHP command line (php) running maintenance scripts that start shells, such as composer or wp-cli
level: high
