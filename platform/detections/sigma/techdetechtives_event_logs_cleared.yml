title: TechDetechtives - Windows Event Logs Cleared From the Command Line
id: f10fd44a-2be0-5788-9c9a-1d6f05be19f5
status: experimental
description: >
  Detects wevtutil or PowerShell being used to clear event logs, which removes
  the record of what was done on the machine.
author: TechDetechtives
date: 2026-10-05
tags:
  - attack.t1685.005
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil_image:
    Image|endswith: '\wevtutil.exe'
  selection_wevtutil_action:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  selection_powershell:
    CommandLine|contains:
      - 'Clear-EventLog'
      - 'Remove-EventLog'
      - '.ClearEventLog('
  condition: (selection_wevtutil_image and selection_wevtutil_action) or selection_powershell
falsepositives:
  - Image preparation and lab reset scripts
level: high
