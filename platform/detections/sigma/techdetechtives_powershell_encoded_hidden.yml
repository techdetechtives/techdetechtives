title: TechDetechtives - PowerShell Encoded Command With Hidden Window
id: fb81b1e9-8586-4a63-9ac0-0d99d38acd5e
status: experimental
description: >
  Detects PowerShell started with both an encoded command and a hidden
  window, a combination that is common in malicious launchers and rare in
  interactive administration.
author: TechDetechtives
date: 2026-10-04
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  selection_hidden:
    CommandLine|contains:
      - ' -w hidden'
      - ' -WindowStyle Hidden'
      - ' -win hidden'
  condition: selection_image and selection_encoded and selection_hidden
falsepositives:
  - Software deployment tools that wrap their scripts this way
level: high
