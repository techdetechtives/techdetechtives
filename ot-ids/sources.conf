# External detection content for the OT IDS: rule sets, threat indicators and
# the catalogue of known-exploited vulnerabilities.
#
# Nothing listed here is stored in this repository. `./build-iso.sh sources`
# (part of a normal build) and tools/make-update-bundle.sh download the enabled
# sources on a machine with Internet access, convert them, and the result is
# carried into the ISO or onto an installed system offline.
#
# kind:
#   snort-git     Snort 2 rules in a git repository; converted for Suricata
#   snort-url     Snort 2 rules at a web address (.rules or .tar.gz); converted
#   suricata-git  Suricata rules in a git repository; renumbered from sid_base and
#                 rate-limited like the Snort kinds, otherwise unchanged
#   suricata-url  Suricata rules at a web address (.rules or .tar.gz); used as is
#   yara-git      YARA rule files in a git repository; copied, each under a unique name
#   intel-git     Zeek intelligence files in a git repository; used as is
#   ioc-url       a plain list of indicators at a web address; converted
#   kev-url       CISA's Known Exploited Vulnerabilities catalogue (JSON)
#
# limit_seconds   rules with no rate limit get one alert per address per this time
# once_per_window rules that alert on every Nth match alert once per window instead
# skip_sids       original signature numbers to leave out
#
# yara-git options:
#   include            folders or file patterns to take (default: every .yar and .yara file)
#   exclude            folders or file patterns to leave out
#   drop_rules         rule names to cut out
#   drop_known         yes = cut rules whose name a source listed above already supplies
#   skip_noncommercial no = keep files that state a non-commercial licence (default: leave them out)
#
# commit (git kinds, optional): use exactly this commit. Rule sets are pinned so
# a build is repeatable; threat feeds are not, because they change daily.
#
# Check each source's licence against how you distribute the product. Rules
# under the GPL can be shipped alongside it; ask a lawyer before selling a
# product that includes them.

[elitewolf]
enabled = yes
kind = snort-git
about = NSA Cybersecurity ELITEWOLF: activity on Rockwell, Schweitzer (SEL) and Siemens device interfaces
url = https://github.com/nsacyber/ELITEWOLF.git
commit = f0c4c951ef4b8233015259fe5af7c71355c04c4a
files = ELITEWOLF_SNORT_AllenBradley_RockwellAutomation.txt, ELITEWOLF_SNORT_SchweitzerEngineeringLaboratories.txt, ELITEWOLF_SNORT_Siemens.txt
sid_base = 1910000
limit_seconds = 300
licence = CC0-1.0

[quickdraw]
enabled = yes
kind = snort-git
about = Digital Bond Quickdraw: BACnet, DNP3, EtherNet/IP, Modbus, Modicon, Niagara Fox, Omron FINS and S7 operations
url = https://github.com/digitalbond/Quickdraw-Snort.git
commit = 665e17180a294ca7ceb9a39eee853515dbbce31a
files = all-quickdraw.rules
sid_base = 1911000
limit_seconds = 300
licence = MIT

[nmap-scans]
enabled = yes
kind = suricata-git
about = Aleksi Bovellan's Nmap scan detection: SYN, connect, ACK, Xmas, fragmented and UDP scans, by Nmap's own packet traits and timing
url = https://github.com/aleksibovellan/opnsense-suricata-nmaps.git
commit = 678d8501d978b42d84ae7417660d30cd63052ef2
files = local.rules
sid_base = 1912000
limit_seconds = 300
once_per_window = yes
# 3400020 and 3400021 alert on every packet to port 4444, at the highest
# priority. That is too blunt for a plant network, so they are left out.
skip_sids = 3400020, 3400021
licence = MIT

[public-threat-feeds]
enabled = yes
kind = intel-git
about = Critical Path Security's daily Zeek-format collection of public threat feeds (this selection: abuse.ch botnet controllers, ThreatFox addresses, malware hashes, Cobalt Strike servers, compromised hosts)
url = https://github.com/CriticalPathSecurity/Zeek-Intelligence-Feeds.git
files = abuse-ch-ipblocklist.intel, abuse-ch-threatfox-ip.intel, abuse-ch-malware.intel, cobaltstrike_ips.intel, compromised-ips.intel
licence = MIT (collection); each feed keeps its own terms

# --- The YARA rule sets the product itself is built with ------------------------
# The product's file scanner is built with these nine repositories compiled in,
# and their sources are then deleted from its image. At each start it compiles
# again from the rule files it can find, and without Internet those are only
# the files in ./yara/rules. This kit puts rules of its own there, so without
# the sources below the installed system would scan with this kit's rules alone
# (tools/yara_sources.py and docs/LISTED-REPOSITORIES-REVIEW.md explain and
# show the check). The list is the one in the product's
# strelka/backend/yara_rules_setup.sh; each is pinned to the commit the kit was
# checked with. Delete a 'commit' line to take that source's newest rules.

[yara-signature-base]
enabled = yes
kind = yara-git
about = Florian Roth's signature-base: malware, hack tools, web shells, exploit and threat-group YARA rules (bundled by the product)
url = https://github.com/Neo23x0/signature-base.git
commit = 94a1c48d7ab499879287ff611dfe7f9c56376030
# Two files at this commit name another licence in their header: the GPL, and CAPE Sandbox's (GPL-3.0).
exclude = yara/gen_loaders.yar, yara/mal_qbot_feb23.yar
licence = Detection Rule License 1.1 (files that state a non-commercial licence or the GPL are left out)

[yara-elastic]
enabled = yes
kind = yara-git
about = Elastic Security protections-artifacts: malware family YARA rules for Windows, Linux and macOS (bundled by the product)
url = https://github.com/elastic/protections-artifacts.git
commit = a51ed0388d97e8174f92bd6a787d477071eff6fc
licence = Elastic License 2.0 (not an open-source licence: read LICENSE.txt, copied beside the rules, before you pass the product on)

[yara-reversinglabs]
enabled = yes
kind = yara-git
about = ReversingLabs YARA rules: ransomware, trojans, backdoors and other malware families (bundled by the product)
url = https://github.com/reversinglabs/reversinglabs-yara-rules.git
commit = e0a0be54aa1e11ccfd6854e4f19e9476f328fd84
licence = MIT

