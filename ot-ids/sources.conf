# CAPE Sandbox's rules: the ninth set the product's own image is built with.
# Off, like every source under the GPL in this file. It was on in 0.14.0 only;
# the owner switched it off again in 0.14.1 (223 rules for malware families and
# packers, under the GPL-3.0, were not worth it for this appliance). To use it,
# set enabled = yes: whoever then passes an ISO or update on is distributing
# these rule files under the GPL-3.0, whose text is copied beside them.
[yara-cape]
enabled = no
kind = yara-git
about = CAPE Sandbox YARA rules: malware families and packers (bundled by the product)
url = https://github.com/kevoreilly/CAPEv2.git
commit = d8d2e646255756166cb1177f7a8d957268f76068
licence = GPL-3.0
# Left out whole: its one rule (SparkRAT) needs three of ten short paths such as
# "/utils" and three of 26 words such as "PING", and fires on Docker's own
# daemon (/usr/bin/dockerd), found by the reviewer of 0.14.0.
exclude = data/yara/CAPE/SparkRAT.yar

[cisa-kev]
enabled = yes
kind = kev-url
about = CISA Known Exploited Vulnerabilities catalogue, used to rank the vulnerability coverage report
url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
licence = CC0-1.0

# --- Off by default. Turn on what you need. -----------------------------------

[yara-rules-legacy]
enabled = no
kind = yara-git
about = Yara-Rules/rules, the community collection last changed in April 2022: only the folders of use for files taken from traffic, less the rules that fire on ordinary files and the rules the sources above already supply
url = https://github.com/Yara-Rules/rules.git
commit = 0f93570194a80d2f2032869055808b0ddcdfb360
include = malware, maldocs, cve_rules, webshells
# Two files under a non-commercial licence are left out by the default. These
# rules fired on ordinary programs, documents and scripts when the kit was
# checked (docs/LISTED-REPOSITORIES-REVIEW.md):
drop_rules = invalid_trailer_structure, powershell, maldoc_getEIP_method_1, maldoc_find_kernel32_base_method_1, PoetRat_Python, JavaDropper, spyeye, PM_Zip_with_js, php_uname
drop_known = yes
licence = GPL-2.0 (a few files state BSD-2-Clause or MIT)

