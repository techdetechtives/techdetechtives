# TechDetechtives OT IDS: kernel modules this appliance never needs.
# "install <module> /bin/false" makes any attempt to load the module fail.

# Network protocols with a history of kernel flaws and no use here.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false

# Filesystems that are never mounted on this appliance. (USB sticks with FAT,
# exFAT, NTFS or ext4, and UDF/ISO media, still work.)
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false

# FireWire gives a plugged-in device direct access to memory.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
