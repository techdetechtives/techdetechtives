# TechDetechtives OT IDS: kernel settings added on top of the base system's.
# The base system (Malcolm) already sets the network buffer sizes, turns off
# ICMP redirects and source routing, and needs IP forwarding ON for its
# containers; none of that is changed here.
# A leading "-" means: skip quietly if this kernel does not have the setting.

# Hide kernel addresses from every user, so a local exploit has less to aim at.
kernel.kptr_restrict = 2
# A process may only trace its own children (stops one user process reading another's memory).
-kernel.yama.ptrace_scope = 1
# No magic SysRq keys on the console.
-kernel.sysrq = 0
# The running kernel cannot be replaced without a reboot.
-kernel.kexec_load_disabled = 1
# Only root may load eBPF programs. Packet capture does not need this.
-kernel.unprivileged_bpf_disabled = 1
# Address space layout randomisation, full.
kernel.randomize_va_space = 2

# No memory dumps from programs that changed user or have special rights.
fs.suid_dumpable = 0
# Links in shared folders cannot be used to trick a privileged program.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Survive a SYN flood aimed at the appliance itself.
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.tcp_rfc1337 = 1
