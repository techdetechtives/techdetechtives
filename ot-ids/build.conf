# Settings for ot-ids/build-iso.sh. Edit, then run ./build-iso.sh

# Product name shown on the boot menu ("Install <name>", "Install <name> Sensor")
# and used in the ISO file names. Letters, digits, space, dot, underscore, dash.
BRAND_NAME="TechDetechtives"

# Pinned upstream release. Change only when you are ready to re-test an upgrade.
MALCOLM_REF="v26.09.0"
# The commit that tag pointed at when this kit was written. The build stops if
# the tag has moved. Change both together when you move to a new release.
MALCOLM_COMMIT="b09a0adaee18421bcc24f3c5608d2135a6ee84bb"

# Which installers to build: "malcolm" = central server, "hedgehog" = capture sensor.
FLAVORS="malcolm hedgehog"

# true  = embed every container image in the ISO (installs with no Internet; large ISO)
# false = small ISO; the installed system must pull images from the Internet
INCLUDE_IMAGES="true"

# true  = also put the logo and name in the web applications (landing page,
#         dashboards, upload page, browser tab icons). Needs INCLUDE_IMAGES="true".
BRAND_WEB="true"

# true = download the rule sets and threat feeds enabled in sources.conf and
#        put them in the ISO. Needs Internet access on the build host.
FETCH_SOURCES="true"

# true = add the layer 2 watch from platform/zeek/ (ARP poisoning, an address
#        taken over by another network card, MAC flooding, ARP sweeps). It is
#        added only if the product's own Zeek parses it without error during
#        the 'images' stage; otherwise the build leaves it out and says so.
ZEEK_L2_WATCH="true"

# true = write each rule's MITRE ATT&CK for ICS technique into the copy of the
#        rule that goes into the ISO, so alerts carry it (see attack/). The
#        coverage report is written either way.
ATTACK_ICS_TAGS="true"

# true = add the baseline program to the server (baseline/td_baseline.py): it
#        learns who talks to whom with which operations and then reports what
#        is new or has stopped. It learns from the first start; its alerts stay
#        off until you run 'td-baseline alerts on'. Needs INCLUDE_IMAGES="true".
OT_BASELINE="true"

# true = add the extra hardening under hardening/ (kernel settings, blocked
#        kernel modules, SSH limits, login banner) on top of the base system's.
HARDENING="true"
# Seconds before an SSH or console login shell left idle at its prompt closes.
# 0 = never. (The desktop has its own screen lock, chosen at installation.)
HARDEN_SHELL_TIMEOUT="900"
# true = block USB sticks. Leave false if captures or rule updates will arrive
#        by USB, which is the usual way into an isolated network.
HARDEN_USB_STORAGE_OFF="false"

# auto    = native on a Debian 13 host that has live-build, otherwise Vagrant
# vagrant = build inside the upstream Vagrant VM (any Linux host with a hypervisor)
# native  = build directly on this Debian 13 host (needs sudo)
BUILD_MODE="auto"
